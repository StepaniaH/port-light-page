<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · Port-Light</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0c1016;
      color: #e6edf3;
      font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      text-align: center;
      padding: 24px;
    }
    .dots { display: flex; gap: 10px; justify-content: center; margin-bottom: 22px; }
    .dots i { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #2b3440; }
    .dots i:nth-child(1) { background: #58a6ff; }
    .dots i:nth-child(2) { background: #d4a017; opacity: .55; }
    .dots i:nth-child(3) { background: transparent; }
    h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); letter-spacing: -0.02em; margin: 0 0 10px; }
    p { color: #8b98a5; margin: 0 0 28px; }
    a.btn {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: .95rem;
      text-decoration: none;
      background: #58a6ff;
      color: #0c1016;
    }
    a.ghost { display: block; margin-top: 14px; color: #8b98a5; font-size: .88rem; text-decoration: none; }
    a.ghost:hover { color: #e6edf3; }
  </style>
</head>
<body>
  <main>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1>404 — this port isn't listening.</h1>
    <p>The page you asked for doesn't exist on this host.</p>
    <a class="btn" href="/">Back to Port-Light</a>
    <a class="ghost" href="https://github.com/StepaniaH/port-light">GitHub →</a>
  </main>
</body>
</html>
