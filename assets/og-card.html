<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Space Grotesk";
    src: url("fonts/space-grotesk-latin.woff2") format("woff2");
    font-weight: 300 700;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0c1016;
    color: #e6edf3;
    font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 64px 72px;
    position: relative;
  }
  .glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(720px 420px at 82% 18%, rgba(88,166,255,.14), transparent 65%),
      radial-gradient(560px 360px at 12% 96%, rgba(212,160,23,.08), transparent 60%);
  }
  .top { display: flex; align-items: center; gap: 16px; position: relative; }
  .brand { font-size: 30px; font-weight: 600; letter-spacing: .01em; }
  .middle { position: relative; display: flex; align-items: center; gap: 48px; }
  .copy { max-width: 660px; }
  h1 { font-size: 66px; line-height: 1.08; font-weight: 700; letter-spacing: -.015em; }
  h1 em { font-style: normal; color: #58a6ff; }
  p.lead { margin-top: 24px; font-size: 25px; line-height: 1.45; color: #8b98a5; font-weight: 400; max-width: 600px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, auto);
    gap: 14px;
    flex-shrink: 0;
    margin-left: auto;
  }
  .cell {
    width: 118px;
    height: 84px;
    border-radius: 12px;
    background: #12171f;
    border: 1px solid #2b3440;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 600;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .u { color: #58a6ff; box-shadow: inset 0 0 0 1px rgba(88,166,255,.35); }
  .c { color: #d4a017; box-shadow: inset 0 0 0 1px rgba(212,160,23,.35); }
  .f { color: #3fb950; box-shadow: inset 0 0 0 1px rgba(63,185,80,.35); }
  .bottom { display: flex; align-items: center; justify-content: space-between; position: relative; }
  .chip {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 22px;
    color: #e6edf3;
    background: #161c25;
    border: 1px solid #2b3440;
    padding: 14px 24px;
    border-radius: 10px;
  }
  .chip b { color: #3fb950; font-weight: 500; }
  .url { font-size: 21px; color: #8b98a5; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="top">
    <svg width="52" height="52" viewBox="0 0 64 64" aria-hidden="true">
      <g stroke="#58a6ff" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M32 12 L32 20"/>
        <path d="M20 16 L24 22 M44 16 L40 22"/>
      </g>
      <g stroke="#e6edf3" stroke-width="3" stroke-linejoin="round" fill="none">
        <path d="M27 24 h10 l3 26 h-16 z"/>
        <rect x="26" y="20" width="12" height="5" rx="2"/>
      </g>
      <circle cx="32" cy="22.5" r="2.4" fill="#d4a017"/>
    </svg>
    <span class="brand">Port-Light</span>
  </div>
  <div class="middle">
    <div class="copy">
      <h1>Know which ports are taken, and which are <em>free</em>.</h1>
      <p class="lead">A traffic-light occupancy map for your homelab — listen tables, Docker and Compose merged into one grid.</p>
    </div>
    <div class="grid" aria-hidden="true">
      <span class="cell u">8080</span>
      <span class="cell c">8081</span>
      <span class="cell f">8082</span>
      <span class="cell u">5432</span>
    </div>
  </div>
  <div class="bottom">
    <span class="chip">$ docker pull stepaniah/port-light</span>
    <span class="url">github.com/StepaniaH/port-light</span>
  </div>
</body>
</html>
